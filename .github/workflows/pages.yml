# Publishes the app to the gh-pages branch on every push, which GitHub Pages serves.
name: Publish to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/face-editing-mobile-app-2kjs6y
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html README.md _site/
          cp -r css js _site/
          touch _site/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
          force_orphan: true

# Deploys the app to GitHub Pages on every push to the deploy branches.
# The first run enables Pages for the repository (build type: GitHub Actions).
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/face-editing-mobile-app-2kjs6y
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html README.md _site/
          cp -r css js _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
